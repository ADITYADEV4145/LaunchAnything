baseUrl: http://127.0.0.1:3037
shots:
  - id: problem
    route: /brief.html
    viewport: {width: 760, height: 540}
    waitFor: h1
  - id: sources
    commands:
      - >-
        node dist/cli.js validate product | jq -r '"Sources valid: \(.valid)"'
      - >-
        jq -r '.claims[0] | .id, .sources[].ref' .launch/product.json
    viewport: {width: 760, height: 520}
  - id: plan
    commands:
      - "node dist/cli.js plan --history .launch/history.json | cut -d'|' -f1-4 | tail -n +10 | head -n 8"
    viewport: {width: 760, height: 420}
  - id: copy
    commands:
      - >-
        node dist/cli.js write --channel x | jq -r '.briefs[] | split("/")[-1]'
      - >-
        node dist/cli.js check --channel x | jq -r '"Checks passed: \(.passed)"'
    viewport: {width: 760, height: 520}
  - id: capture
    commands:
      - >-
        bash -o pipefail -c 'node dist/cli.js shots --only sources | jq -r ".[] | .kind, .files[]"'
    viewport: {width: 760, height: 440}
  - id: render
    commands:
      - node dist/cli.js video --help
    viewport: {width: 760, height: 440}
  - id: review
    route: /review/index.html
    viewport: {width: 900, height: 460}
    actions:
      - {type: click, selector: article}
    waitFor: article
  - id: guard
    commands:
      - "node dist/cli.js publish --dry-run; test $? -eq 1"
    viewport: {width: 760, height: 340}
  - id: day
    commands:
      - node dist/cli.js warroom
    viewport: {width: 760, height: 500}
