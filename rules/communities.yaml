permission_scope:
  - '\b(?:self[- ]?promo(?:tion)?|promotions?|advertising|your\s+(?:own\s+)?(?:projects?|products?))\b'
forbidden:
  - 'no self[- ]?promo'
  - 'no advertising'
  - 'no promotion'
restricted:
  - 'self[- ]?promo(?:tion)?\s+only\s+in\b'
  - 'self[- ]?promo(?:tion)?.*(?:sunday|monday|tuesday|wednesday|thursday|friday|saturday|weekend)'
  - '9:1'
  - '10%'
  - 'only on (saturday|weekends)'
  - 'megathread'
  - 'flair.*self[- ]?promo'
allowed:
  - 'self[- ]?promotion (is )?(allowed|welcome)'
  - 'show off'
  - 'share your project'
