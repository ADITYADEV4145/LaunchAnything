  - url: https://news.ycombinator.com/item?id=38733968
    title: "Show HN: Heynote \u2013 A dedicated scratchpad for developers"
    points: 1063
    date: 2023-12-22
    excerpt: "Hey! I made Heynote entirely for my own use case. For many years, I always had an Emacs instance running with the scratch buffer open, even long after I had abandoned Emacs as my programming editor in favor of more recent IDE:s. The simplicity of \u2026"
