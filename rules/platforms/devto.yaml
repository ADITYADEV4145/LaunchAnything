kind: platform
id: devto
name: DEV Community
version: 2
lastVerified: null
verified: false
verifiedFields: []
verificationNotes:
  - Source fetched but did not state the numeric copy limits. All numeric budgets are unverified
    local editorial limits, not platform guarantees.
sources:
  - https://dev.to/terms
title:
  required: true
  maxLength: 128
body:
  minLength: 1
  maxLength: 30000
maxLinks: 10
requiredLink: false
bannedWords: []
guidance:
  - Use a technical walkthrough and disclose affiliation.
template:
  summary:
    - An article of 800-1500 words with at least one code block.
    - Sections for before/after, how it works and limits, under ## headings.
  words: { min: 800, max: 1500 }
  codeBlock: true
  headings:
    - { pattern: '^##+ .*\b(before|after)\b', label: before/after }
    - { pattern: '^##+ .*\bhow it works\b', label: how it works }
    - { pattern: '^##+ .*\blimit', label: limits }
