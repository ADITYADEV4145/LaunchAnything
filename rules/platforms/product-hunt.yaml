kind: platform
style: ["Warm first-person maker comment explaining why you built it."]
id: product-hunt
name: Product Hunt
version: 2
lastVerified: null
verified: false
verifiedFields: []
verificationNotes:
  - Launch guide fetched but did not state tagline or gallery numbers. Tagline 60, gallery 1270x760
    and two images are unverified local budgets; maker comment heading is a local format
    requirement.
sources:
  - https://www.producthunt.com/launch
title:
  required: true
  maxLength: 60
body:
  minLength: 1
  maxLength: 2000
maxLinks: 3
requiredLink: false
bannedWords: []
guidance:
  - Title is a tagline (60 characters). Body is the maker comment.
  - "Gallery: at least 2 images recommended, 1270 × 760 pixels; check assets manually."
taglineMax: 60
makerComment:
  heading: "## Maker comment"
  required: true
gallery:
  minImages: 2
  width: 1270
  height: 760
template:
  summary:
    - 'Tagline (the title) of at most 60 characters, two variants.'
    - A description paragraph before the sections.
    - '"## Maker comment" under 200 words: the story, the problem, and an ask for feedback.'
    - '"## Gallery order": a numbered list of at least two images, the money moment first.'
  sentences: { min: 1, max: 4 }
  sections:
    - { heading: "## Maker comment", minWords: 40, maxWords: 199, ask: true }
    - { heading: "## Gallery order", minItems: 2 }
  variants: title
