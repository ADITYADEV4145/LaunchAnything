kind: platform
id: shorts
name: YouTube Shorts
version: 2
lastVerified: 2026-11-21
verified: false
verifiedFields:
  - title.maxLength
  - body.maxLength
  - captionMax
verificationNotes:
  - Source explicitly states title 100 characters and description 5000 characters. captionMax models
    the description; other budgets are local.
sources:
  - https://support.google.com/youtube/answer/57407
title:
  required: true
  maxLength: 100
body:
  minLength: 1
  maxLength: 5000
maxLinks: 3
requiredLink: false
bannedWords: []
guidance:
  - Title up to 100 characters; description up to 5000.
captionMax: 5000
template:
  summary:
    - '"## Caption": the post caption.'
    - '"## On-screen text": at least three short lines, one per beat of the 9:16 cut (hook, before, action, after, call to action).'
  sections:
    - { heading: "## Caption", minWords: 8 }
    - { heading: "## On-screen text", minItems: 3 }
