kind: platform
style: ["Plain technical language. Avoid adjectives; explain implementation and tradeoffs."]
id: show-hn
name: Show HN
version: 2
lastVerified: 2026-11-21
verified: false
verifiedFields:
  - tryableNow
verificationNotes:
  - Source confirms titles begin Show HN and projects must be ready to try. Exact colon prefix, link
    field, banned-word list and numeric budgets are local enforcement choices.
sources:
  - https://news.ycombinator.com/showhn.html
title:
  required: true
  maxLength: 80
  prefix: "Show HN: "
body:
  minLength: 1
  maxLength: 10000
maxLinks: 2
requiredLink: true
bannedWords:
  - revolutionary
  - game-changing
  - best ever
  - ultimate
  - supercharge
  - groundbreaking
  - disruptive
  - world-class
  - cutting-edge
  - unparalleled
  - unmatched
  - industry-leading
  - next-generation
  - must-have
  - life-changing
  - best-in-class
  - seamless
  - effortless
guidance:
  - Share a project people can try now, not a signup page.
tryableNow: true
template:
  summary:
    - 'Title: "Show HN: <Name> – <what it does, in plain words>", at most 80 characters, two variants.'
    - 'Description of 3-5 sentences above any section, in this order: the problem, what it does, one proof number, how it runs, where to try it.'
    - '"## First comment outline": 3-6 bullets the founder finishes by hand (backstory, how it works, limits, the feedback you want).'
  titlePattern: '^Show HN: \S.* [–-] \S'
  titleExample: 'Show HN: Tasklight – a checklist that lives in one JSON file'
  sentences: { min: 3, max: 5 }
  sections:
    - heading: "## First comment outline"
      minItems: 3
  variants: title
