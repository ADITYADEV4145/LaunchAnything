kind: platform
id: tiktok
name: TikTok
version: 2
lastVerified: null
verified: false
verifiedFields: []
verificationNotes:
  - Source returned navigation only, no caption numbers. Caption and other limits remain unverified
    local budgets.
sources:
  - https://support.tiktok.com/en/using-tiktok/creating-videos
title:
  required: true
  maxLength: 100
body:
  minLength: 1
  maxLength: 2200
maxLinks: 1
requiredLink: false
bannedWords: []
guidance:
  - Use a short demonstration caption; 2200 is a conservative editorial budget.
captionMax: 2200
template:
  summary:
    - '"## Caption": the post caption.'
    - '"## On-screen text": at least three short lines, one per beat of the 9:16 cut (hook, before, action, after, call to action).'
  sections:
    - { heading: "## Caption", minWords: 8 }
    - { heading: "## On-screen text", minItems: 3 }
