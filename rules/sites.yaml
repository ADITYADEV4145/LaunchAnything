{
  "show-hn": {
    "label": "Show HN",
    "goal": "Invite hands-on feedback from technical peers with a tryable demo",
    "submitUrl": "https://news.ycombinator.com/submit",
    "route": "manual",
    "assisted": {
      "routes": [
        "browser"
      ],
      "dailyCap": 1,
      "browserResult": "^https://news\\.ycombinator\\.com/item\\?id=\\d+"
    }
  },
  "product-hunt": {
    "label": "Product Hunt",
    "goal": "Present the product demo and maker story to product discovery readers",
    "submitUrl": "https://www.producthunt.com/posts/new",
    "route": "manual",
    "assisted": {
      "routes": [
        "mcp",
        "browser"
      ],
      "dailyCap": 1,
      "browserResult": "^https://www\\.producthunt\\.com/posts/(?!new(?:$|[/?#]))[^/?#]+",
      "mcpServer": "https://mcp.producthunt.com/mcp"
    }
  },
  "x": {
