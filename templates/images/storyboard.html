<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:{{background}};color:{{foreground}};font-family:Arial,Helvetica,sans-serif;padding:5.8vh 6vw;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;min-height:36px;font-size:clamp(23px,2.1vw,32px);font-weight:700;letter-spacing:-.6px}header img{max-width:190px;max-height:42px;object-fit:contain}header img[src=""]{display:none}.dot{width:11px;height:11px;border-radius:50%;background:{{accent}};box-shadow:0 0 22px {{accent}}44}.has-logo .dot{display:none}.eyebrow{margin:3.5vh 0 1.4vh;font-size:clamp(14px,1.1vw,18px);font-weight:700;letter-spacing:3px;color:{{foreground}};opacity:.76}
h1{position:relative;background:{{background}};font-size:clamp(42px,4.4vw,72px);line-height:1.04;letter-spacing:-2.5px;margin:0;max-width:100%;font-weight:750;text-wrap:balance}.stage{display:flex;align-items:center;justify-content:center;flex:1;min-height:0;margin:2.4vh -2vw 1vh}.stage img{width:100%;height:100%;object-fit:contain;display:block}.stage img[src=""]{display:none}footer{font-size:clamp(13px,1vw,16px);letter-spacing:1.4px;display:flex;justify-content:space-between;align-items:center;min-height:20px;color:{{foreground}};opacity:.72}.line{width:50px;height:3px;background:{{accent}};margin-right:16px;display:inline-block;vertical-align:middle}
.stage img{mask-image:linear-gradient(to right,transparent,#000 4%,#000 96%,transparent),linear-gradient(to bottom,transparent,#000 4%,#000 96%,transparent);mask-composite:intersect}footer span:has(.hostname:empty){visibility:hidden}
.portrait h1{font-size:76px;letter-spacing:-3px;line-height:1.07}.portrait .eyebrow{margin-top:7vh}.portrait header{font-size:34px}.portrait footer{font-size:18px}.title-card .eyebrow{margin-top:auto}.title-card h1{font-size:clamp(60px,6.8vw,105px);max-width:95%;line-height:1.03}.title-card .stage{flex:0;margin:0;display:none}.title-card footer{margin-top:auto;padding-top:5vh}.title-card h1:after{content:'';display:block;width:90px;height:6px;background:{{accent}};margin-top:44px;border-radius:9px}
</style></head><body class="{{classes}}"><header><span class="dot"></span><img src="{{logo}}" alt=""><span>{{title}}</span></header><div class="eyebrow">{{eyebrow}}</div><h1 data-headline>{{headline}}</h1><div class="stage"><img src="{{screenshot}}" alt=""></div><footer><span><i class="line"></i><span class="hostname">{{host}}</span></span><span>{{pagination}}</span></footer></body></html>
