<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;padding:56px 64px;background:{{background}};background-image:radial-gradient(ellipse at 85% 0%,{{accent}}22,transparent 65%),linear-gradient(145deg,transparent,#0003);font-family:Arial,sans-serif;color:{{foreground}};display:grid;place-items:center;min-height:100vh}
.window{width:{{frameWidth}}px;border:1px solid #ffffff24;border-radius:18px;overflow:hidden;background:#171d2a;box-shadow:0 32px 64px #0007,0 4px 14px #0004}
.bar{height:46px;display:flex;align-items:center;justify-content:center;position:relative;background:#202738;border-bottom:1px solid #ffffff12;font-size:16px;font-weight:600;color:#e7edf7;letter-spacing:.3px}
.lights{position:absolute;left:20px;display:flex;gap:8px}.lights i{display:block;width:11px;height:11px;border-radius:50%;background:#ff665c}.lights i:nth-child(2){background:#ffca55}.lights i:nth-child(3){background:#52cf88}
.address{background:#101827;padding:6px 56px;border-radius:7px;color:#cbd5e1;font-size:14px;font-weight:400}
.content{position:relative;overflow:hidden;height:{{contentHeight}}px}.content img{display:block;width:100%;height:auto}
.ring{position:absolute;left:calc({{hx}}% - 6px);top:calc({{hy}}% - 6px);width:calc({{hw}}% + 12px);height:calc({{hh}}% + 12px);border:3.5px solid {{accent}};border-radius:8px;box-shadow:0 0 0 5px {{accent}}18,0 0 24px {{accent}}55;display:{{ringDisplay}};pointer-events:none}
.phone{border:10px solid #293040;border-radius:42px;background:#111827}.phone .bar{height:25px;background:#111827;border:0}.phone .bar span,.phone .lights{display:none}.phone .bar:after{content:'';background:#050a12;width:80px;height:12px;border-radius:20px}.phone .content{border-radius:0 0 28px 28px}
.card{display:none}.title-card .window{display:none}.title-card .card{display:block;max-width:1000px;font-size:76px;font-weight:700;line-height:1.08;letter-spacing:-3px;padding:100px 30px;border-left:5px solid {{accent}}}
</style></head><body class="{{cardClass}}"><div class="window {{kind}}"><div class="bar"><div class="lights"><i></i><i></i><i></i></div><span class="{{addressClass}}">{{windowTitle}}</span></div><div class="content"><img src="{{screenshot}}" alt=""><div class="ring"></div></div></div><div class="card">{{caption}}</div></body></html>
